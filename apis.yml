aid: aardvark-therapeutics
name: Aardvark Therapeutics
description: 'Aardvark Therapeutics, Inc. is a Nasdaq-listed (AARD) clinical-stage biopharmaceutical
  company developing novel small-molecule therapies designed to inhibit hunger and treat metabolic
  disease. Its lead candidate, ARD-101, is an oral, gut-restricted agonist of bitter taste receptors
  (TAS2Rs) on the luminal side of the intestine, which triggers the release of satiety hormones to
  suppress hunger signaling; it has been evaluated for hyperphagia associated with Prader-Willi
  Syndrome, including the Phase 3 HERO trial, as well as in obesity and hypothalamic obesity. The
  company operates purely as a drug-development organization: its public web presence consists of
  science, programs, team, news and investor-relations material, and it publishes no developer
  program, public API, SDK, webhook surface or machine-readable specification of any kind.'
